name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MAiMoney.slnx

      - name: Build
        run: dotnet build MAiMoney.slnx --configuration Release --no-restore

      # The service tests start their own throw-away MongoDB (EphemeralMongo), no service container needed.
      - name: Test
        run: >-
          dotnet test MAiMoney.slnx --configuration Release --no-build
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
